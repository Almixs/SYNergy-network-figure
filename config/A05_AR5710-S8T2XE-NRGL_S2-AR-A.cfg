#
# SYNergy campus network, configuration A.5
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.5
#
# Device: NetEngine AR5710-S8T2XE-NRGL
# Name:   S2-AR-A
# Role:   5G last resort and out-of-band access
#
# Software: the release of Table 66; the commands follow the AR configuration
# guides linked below. 5G dial-up with the operator APN, an IPsec tunnel to
# the home DC hub with the same profile as the edges, and the out-of-band port
# to the site's OOB switch (VRF MGMT). For users the router carries the same
# VRFs as the WAN edges in MPLS L3VPN; the site cores receive its routes with
# a longer AS path, so 5G carries users only when both ISPs are down, and a
# traffic policy enforces the budget of Table 16.
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   AR5710-S8T2XE hardware description
#   https://support.huawei.com/enterprise/en/doc/EDOC1100213474/eda91d59/ar5710-s8t2xe-50010731
#   AR Configuration Guide: 5G Cellular Interface Configuration
#   https://support.huawei.com/enterprise/en/doc/EDOC1100203257/c5c7a385/5g-cellular-interface-configuration
#   AR Configuration Guide: Configuring APN Profiles (dual SIM cards)
#   https://support.huawei.com/enterprise/en/doc/EDOC1100332359/8e2d79a3/configuring-apn-profiles-dual-sim-cards
#

# S2-AR-A (NetEngine AR5710-S8T2XE-NRGL): 5G last resort and out-of-band access of Site 2
sysname S2-AR-A
#
ip vpn-instance STAFF
 ipv4-family
  route-distinguisher 10.255.1.51:1
  vpn-target 65001:1 export-extcommunity
  vpn-target 65001:1 import-extcommunity
# the other VRFs as on S1-PE-A
#
mpls lsr-id 10.255.1.51
mpls
mpls ldp
#
dialer-rule
 dialer-rule 1 ip permit
#
apn profile APN-1
 apn <operator APN>
#
interface Cellular0/0/0
 description 5G-<operator>
 dialer enable-circular
 dialer-group 1
 apn-profile APN-1
 dialer timer autodial 60
 dialer number *99# autodial
 ip address negotiate
#
pki entity S2-AR-A
 common-name S2-AR-A
#
pki realm EJBCA
 ca id SYNergy-Issuing-CA
 entity S2-AR-A
 enrollment-url http://10.200.10.31/ejbca/publicweb/apply/scep/pkiclient.exe ra
#
ipsec proposal P-WAN
 esp authentication-algorithm sha2-256
 esp encryption-algorithm aes-256
#
ike proposal 10
 encryption-algorithm aes-256
 dh group20
 authentication-algorithm sha2-256
 authentication-method rsa-signature
 integrity-algorithm hmac-sha2-256
 prf hmac-sha2-256
#
ike peer HUBS
 undo version 1
 ike-proposal 10
 pki realm EJBCA
#
ipsec profile IPSEC-WAN
 ike-peer HUBS
 proposal P-WAN
 pfs dh-group20
#
interface Tunnel0/0/1
 description TUN-DC2-HUB-1-5G
 mtu 1400
 tcp adjust-mss 1360
 ip address 10.255.11.1 255.255.255.252
 tunnel-protocol gre
 source Cellular0/0/0
 destination 192.0.2.20
 ipsec profile IPSEC-WAN
 ospf cost 1000
 mpls
 mpls ldp
#
interface GigabitEthernet0/0/1
 description OOB-S2-OOB-A
 ip address 10.1.255.1 255.255.255.0
#
interface GigabitEthernet0/0/2.1001
 description TO-S2-CORE-A-VRF-STAFF
 vlan-type dot1q 1001
 ip binding vpn-instance STAFF
 ip address 10.254.21.9 255.255.255.252
#
interface LoopBack0
 description RID
 ip address 10.255.1.51 255.255.255.255
#
ospf 1 router-id 10.255.1.51
 area 0.0.0.0
  network 10.255.1.51 0.0.0.0
  network 10.255.11.0 0.0.0.3
#
route-policy RP-5G-BACKUP permit node 10
 apply as-path 65001 65001 65001 additive
#
bgp 65001
 router-id 10.255.1.51
 peer 10.255.1.21 as-number 65001
 peer 10.255.1.21 connect-interface LoopBack0
 #
 ipv4-family vpnv4
  policy vpn-target
  peer 10.255.1.21 enable
 #
 ipv4-family vpn-instance STAFF
  peer 10.254.21.10 as-number 65112
  peer 10.254.21.10 route-policy RP-5G-BACKUP export
#
# Table 16 budget: each class is policed to its share, everything else is dropped;
# ACL 3500 lists the servers of the air-raid alert app and the messengers;
# the DC-2 hubs police the same classes towards the site
traffic classifier C-MGMT
 if-match dscp cs6
traffic classifier C-VOICE
 if-match dscp ef
traffic classifier C-LECTURE
 if-match dscp af41
traffic classifier C-WORK
 if-match dscp af31
traffic classifier C-MESSAGES
 if-match acl 3500
traffic classifier C-OTHER
 if-match any
#
traffic behavior B-MGMT
 car cir 5000
traffic behavior B-VOICE
 car cir 3000
traffic behavior B-LECTURE
 car cir 30000
traffic behavior B-WORK
 car cir 45000
traffic behavior B-MESSAGES
 car cir 10000
traffic behavior B-DROP
 deny
#
traffic policy P-5G
 classifier C-MGMT behavior B-MGMT
 classifier C-VOICE behavior B-VOICE
 classifier C-LECTURE behavior B-LECTURE
 classifier C-WORK behavior B-WORK
 classifier C-MESSAGES behavior B-MESSAGES
 classifier C-OTHER behavior B-DROP
#
interface Tunnel0/0/1
 traffic-policy P-5G outbound
#
ip route-static 0.0.0.0 0.0.0.0 Cellular0/0/0
ip route-static 10.200.10.0 255.255.255.0 Tunnel0/0/1
ip route-static 10.201.10.0 255.255.255.0 Tunnel0/0/1
#
return
