#
# SYNergy campus network, configuration A.7
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.7
#
# Device: CloudEngine S5755-S48P8Y
# Name:   S1-K3-F2-ACC-1
# Role:   access switch
#
# Software: the release of Table 66; the commands follow the CloudEngine S
# V600R022C10 and V600R023C10 guides linked below. 802.1X with MAC bypass on
# every outlet against NCE-Campus (RADIUS in both DCs), the VLAN and VRF come
# from NCE; AP ports trunk with the AP management VLAN as PVID; one Eth-Trunk
# to the M-LAG aggregation pair.
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   CloudEngine S V600R022C10 Configuration Guide: Configuring an
#   Authentication Access Device
#   https://support.huawei.com/enterprise/en/doc/EDOC1100304990/ce2a2ed4/configuring-an-authentication-access-device
#   CloudEngine S V600R023C10 Configuration Guide: User Access and
#   Authentication
#   https://support.huawei.com/enterprise/en/doc/EDOC1100366631/8dda70bc
#

# S1-K3-F2-ACC-1 (CloudEngine S5755-S48P8Y): access switch, academic building 3, floor 2
sysname S1-K3-F2-ACC-1
#
vlan batch 11 12 102 202 502 552 602 802
#
dhcp enable
dhcp snooping enable
dhcp snooping enable vlan 102 202 502 552 602 802
stp bpdu-protection
#
radius-server template NCE
 radius-server shared-key cipher <key>
 radius-server authentication 10.200.10.21 1812
 radius-server authentication 10.201.10.21 1812 secondary
 radius-server accounting 10.200.10.21 1813
 radius-server accounting 10.201.10.21 1813 secondary
radius-server authorization 10.200.10.21 shared-key cipher <key>
radius-server authorization 10.201.10.21 shared-key cipher <key>
#
aaa
 authentication-scheme AUTH-NCE
  authentication-mode radius
 accounting-scheme ACC-NCE
  accounting-mode radius
 domain campus
  authentication-scheme AUTH-NCE
  accounting-scheme ACC-NCE
  radius-server NCE
#
dot1x-access-profile name DOT1X
#
mac-access-profile name MAB
#
authentication-profile name NAC
 dot1x-access-profile DOT1X
 mac-access-profile MAB
 access-domain campus force
# RADIUS of NCE unreachable (DC-1 lost before the DR copy runs): new users get VLAN 502
# (Internet, LMS and lectures through the DMZ)
 authentication event authen-server-down action authorize vlan 502
 authentication event authen-server-up action re-authen
#
interface Eth-Trunk1
 description TO-S1-K3-AGG-A-AGG-B M-LAG 1
 mode lacp-static
 port link-type trunk
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 11 12 102 202 502 552 602 802
 dhcp snooping trusted
#
interface GE1/0/1
 description A11-PHD-01
 port link-type access
 port default vlan 202
 stp edged-port enable
 authentication-profile NAC
 ip source check user-bind enable
 arp anti-attack check user-bind enable
 storm-control broadcast min-rate 1000 max-rate 2000
# GE1/0/2-29: the other outlets of Table 27 the same way;
# the VLAN comes from NCE after 802.1X or MAB;
# ND snooping and RA guard on the IPv6 user VLANs per the IPv6 security chapter of the same
# guide; the same port protection on A.8 and A.10
#
interface GE1/0/33
 description S1-K3-F2-AP-54
 port link-type trunk
 port trunk pvid vlan 12
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 12 102 202 502 802
 stp edged-port enable
# GE1/0/34-39: the other APs of ACC-1 (Table 27) the same way
#
interface 25GE1/0/1
 description TO-S1-K3-AGG-A
 eth-trunk 1
#
interface 25GE1/0/2
 description TO-S1-K3-AGG-B
 eth-trunk 1
#
interface Vlanif11
 description MGMT
 ip address 10.0.33.21 255.255.255.0
#
ip route-static 0.0.0.0 0.0.0.0 10.0.33.1
#
return
