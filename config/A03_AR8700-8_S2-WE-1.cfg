#
# SYNergy campus network, configuration A.3
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.3
#
# Device: NetEngine AR8700-8
# Name:   S2-WE-1
# Role:   WAN edge of Site 2
#
# Software: the release of Table 66; the commands follow the V600R023 guide
# linked below. IKEv2 with EJBCA certificates, an IPsec profile on each GRE
# tunnel, MPLS LDP inside the tunnels and MP-BGP VPNv4/VPNv6 to the hubs as
# route reflectors; BFD 300 ms x 3 moves traffic to the other ISP line.
# Tunnels to the home DC-2 hubs are preferred; the DC-1 hubs have a higher
# OSPF cost. MTU 1,400 and TCP MSS 1,360.
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   AR5700, AR6700, AR8000 V600R023 Configuration Guide, VPN: Configuring an
#   IPsec Policy
#   https://support.huawei.com/enterprise/en/doc/EDOC1100336497/be7958e2/configuring-an-ipsec-policy
#   Example for Establishing an IPsec Tunnel in ISAKMP Mode Using Certificate
#   Authentication (V600R022)
#   https://support.huawei.com/enterprise/en/doc/EDOC1100262540/29ab816a/example-for-establishing-an-ipsec-tunnel-in-isakmp-mode-using-certificate-authentication
#

# S2-WE-1 (NetEngine AR8700-8): WAN edge of Site 2, home DC = DC-2
sysname S2-WE-1
#
ip vpn-instance STAFF
 ipv4-family
  route-distinguisher 10.255.1.31:1
  vpn-target 65001:1 export-extcommunity
  vpn-target 65001:1 import-extcommunity
 ipv6-family
  route-distinguisher 10.255.1.31:1
  vpn-target 65001:1 export-extcommunity
  vpn-target 65001:1 import-extcommunity
# the other VRFs as on S1-PE-A
#
bfd
#
mpls lsr-id 10.255.1.31
#
mpls
#
mpls ldp
#
pki entity S2-WE-1
 common-name S2-WE-1
#
pki realm EJBCA
 ca id SYNergy-Issuing-CA
 entity S2-WE-1
 enrollment-url http://10.200.10.31/ejbca/publicweb/apply/scep/pkiclient.exe ra
#
ipsec proposal P-WAN
 esp authentication-algorithm sha2-256
 esp encryption-algorithm aes-256
#
ike proposal 10
 encryption-algorithm aes-256
 dh group20
 authentication-algorithm sha2-256
 authentication-method rsa-signature
 integrity-algorithm hmac-sha2-256
 prf hmac-sha2-256
#
ike peer HUBS
 undo version 1
 ike-proposal 10
 pki realm EJBCA
#
ipsec profile IPSEC-WAN
 ike-peer HUBS
 proposal P-WAN
 pfs dh-group20
#
interface XGigabitEthernet0/0/1
 description ISP-A-<circuit id>
 ip address <ISP A line address> 255.255.255.252
#
interface XGigabitEthernet0/0/2
 description ISP-B-<circuit id>
 ip address <ISP B line address> 255.255.255.252
#
interface XGigabitEthernet0/0/3.1001
 description TO-S2-CORE-A-VRF-STAFF
 vlan-type dot1q 1001
 ip binding vpn-instance STAFF
 ip address 10.254.21.1 255.255.255.252
#
interface LoopBack0
 description RID
 ip address 10.255.1.31 255.255.255.255
#
interface Tunnel0/0/1
 description TUN-DC2-HUB-1-ISP-A
 mtu 1400
 tcp adjust-mss 1360
 ip address 10.255.10.1 255.255.255.252
 tunnel-protocol gre
 source XGigabitEthernet0/0/1
 destination 192.0.2.20
 ospf bfd enable
 ospf bfd min-tx-interval 300 min-rx-interval 300 detect-multiplier 3
 mpls
 mpls ldp
 ipsec profile IPSEC-WAN
#
interface Tunnel0/0/2
 description TUN-DC2-HUB-3-ISP-B
 mtu 1400
 tcp adjust-mss 1360
 ip address 10.255.10.5 255.255.255.252
 tunnel-protocol gre
 source XGigabitEthernet0/0/2
 destination 192.0.2.22
 ospf bfd enable
 ospf bfd min-tx-interval 300 min-rx-interval 300 detect-multiplier 3
 mpls
 mpls ldp
 ipsec profile IPSEC-WAN
#
interface Tunnel0/0/3
 description TUN-DC1-HUB-1-ISP-A
 mtu 1400
 tcp adjust-mss 1360
 ip address 10.255.10.9 255.255.255.252
 tunnel-protocol gre
 source XGigabitEthernet0/0/1
 destination 198.51.100.20
 ospf cost 100
 ospf bfd enable
 ospf bfd min-tx-interval 300 min-rx-interval 300 detect-multiplier 3
 mpls
 mpls ldp
 ipsec profile IPSEC-WAN
# Tunnel0/0/4 to 0/0/8: the other hubs of both DCs over ISP A and ISP B the same way
#
ospf 1 router-id 10.255.1.31
 area 0.0.0.0
  network 10.255.1.31 0.0.0.0
  network 10.255.10.0 0.0.0.255
#
ip route-static <ISP A next hop network> XGigabitEthernet0/0/1 <ISP A gateway>
ip route-static 0.0.0.0 0.0.0.0 XGigabitEthernet0/0/1 <ISP A gateway>
ip route-static 0.0.0.0 0.0.0.0 XGigabitEthernet0/0/2 <ISP B gateway>
# each tunnel leaves through the ISP of its own line: host routes to the hub addresses
ip route-static 192.0.2.20 255.255.255.255 XGigabitEthernet0/0/1 <ISP A gateway>
ip route-static 198.51.100.20 255.255.255.255 XGigabitEthernet0/0/1 <ISP A gateway>
ip route-static 192.0.2.22 255.255.255.255 XGigabitEthernet0/0/2 <ISP B gateway>
#
bgp 65001
 router-id 10.255.1.31
 peer 10.255.1.21 as-number 65001
 peer 10.255.1.21 connect-interface LoopBack0
 peer 10.255.1.23 as-number 65001
 peer 10.255.1.23 connect-interface LoopBack0
 peer 10.255.1.11 as-number 65001
 peer 10.255.1.11 connect-interface LoopBack0
 #
 ipv4-family vpnv4
  policy vpn-target
  peer 10.255.1.21 enable
  peer 10.255.1.23 enable
  peer 10.255.1.11 enable
 #
 ipv6-family vpnv6
  policy vpn-target
  peer 10.255.1.21 enable
  peer 10.255.1.23 enable
  peer 10.255.1.11 enable
 #
 ipv4-family vpn-instance STAFF
  peer 10.254.21.2 as-number 65112
  peer 10.254.21.2 bfd enable
#
return
