#
# SYNergy campus network, configuration A.6
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.6
#
# Device: CloudEngine S6750-H48Y8C
# Name:   S1-A1-AGG-A
# Role:   M-LAG and VXLAN gateway
#
# Software: the release of Table 66; the commands follow the CloudEngine S
# V600R022C10 and V600R023C00 guides linked below. The aggregation pair is the
# gateway of the building: an anycast Vbdif per VLAN in its VRF, the access
# switches and FTTO switches on M-LAG trunks, eBGP underlay to both site cores
# and BGP EVPN to the cores as route reflectors. VLANs as in Table 78; shown
# for STAFF (VLAN 101).
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   CloudEngine S V600R022C10 Configuration Guide, VXLAN: Establishing VXLAN
#   Tunnels in BGP EVPN Mode (Distributed Gateway)
#   https://support.huawei.com/enterprise/en/doc/EDOC1100302469/299cd609/example-for-establishing-vxlan-tunnels-in-bgp-evpn-mode-distributed-vxlan-gateway
#   CloudEngine S V600R023C00 Configuration Guide: Configuration Examples for
#   M-LAG
#   https://support.huawei.com/enterprise/en/doc/EDOC1100334383/ce1602ef/configuration-examples-for-m-lag
#
# Table 78. VLANs of the administrative building S1-A1 (gateways: Vbdif on the aggregation pair)
#   VLAN  Name            VRF      Used by
#   11    MGMT-S1-A1-SW   MGMT     FTTO switches, room units (address by DHCP for ZTP), UPS
#   12    MGMT-S1-A1-AP   MGMT     AP management, CAPWAP to AC-1 and AC-2
#   101   STAFF-S1-A1     STAFF    staff PCs, SYN-Staff Wi-Fi
#   201   STUDENT-S1-A1   STUDENT  eduroam Wi-Fi
#   501   GUEST-S1-A1     GUEST    SYN-Guest Wi-Fi, visitors
#   551   VOICE-S1-A1     VOICE    24 IP phones (LLDP-MED)
#   601   PRINT-S1-A1     PRINT    52 printers
#   801   IOT-S1-A1       IOT      projectors and AV, SYN-IoT
#   4001  SMARTLINK-CTRL  -        Smart Link flush messages between the RUs and the FTTO switches only
#

# S1-A1-AGG-A (CloudEngine S6750-H48Y8C): M-LAG member and VXLAN gateway
# of administrative building S1-A1
sysname S1-A1-AGG-A
#
dfs-group 1
 dual-active detection source ip 10.0.255.1 peer 10.0.255.2
 priority 150
#
stp mode rstp
stp v-stp enable
#
evpn-overlay enable
#
dhcp enable
#
ip vpn-instance STAFF
 ipv4-family
  route-distinguisher 10.0.254.1:1
  vpn-target 65001:1 export-extcommunity evpn
  vpn-target 65001:1 import-extcommunity evpn
 vxlan vni 50001
# STUDENT 50002, GUEST 50003, VOICE 50004, PRINT 50005, IOT 50007, MGMT 50000 the same way
#
bridge-domain 101
 vxlan vni 101101
 evpn
  route-distinguisher 10.0.254.1:10101
  vpn-target 65001:101101 export-extcommunity
  vpn-target 65001:1 export-extcommunity
  vpn-target 65001:101101 import-extcommunity
# bridge domains 11, 12, 201, 501, 551, 601, 801 the same way;
# L2 VNI = 100000 + 1000 x building number + VLAN
# (A1 = 1, K1-K6 = 11-16, D1-D8 = 21-28), so equal VLAN numbers of two buildings
# never share a VNI
#
interface Vbdif101
 description STAFF-S1-A1
 ip binding vpn-instance STAFF
 ip address 10.16.0.1 255.255.252.0
 mac-address 0000-5e00-0102
 vxlan anycast-gateway enable
 arp collect host enable
 dhcp select relay
 dhcp relay server-ip 10.200.10.12
 dhcp relay server-ip 10.201.10.12
#
interface Eth-Trunk0
 description PEER-LINK-TO-S1-A1-AGG-B
 mode lacp-static
 peer-link 1
#
interface Eth-Trunk12
 description TO-S1-A1-FT1-2 M-LAG 12
 mode lacp-static
 stp edged-port enable
 dfs-group 1 m-lag 12
#
interface Eth-Trunk12.101 mode l2
 encapsulation dot1q vid 101
 bridge-domain 101
#
interface 25GE1/0/12
 description TO-S1-A1-FT1-2-10GE1/0/47
 eth-trunk 12
#
interface 100GE1/0/7
 eth-trunk 0
#
interface 100GE1/0/8
 eth-trunk 0
#
interface 25GE1/0/47
 description TO-S1-CORE-A-25GE1/0/11
 undo portswitch
 ip address 10.0.253.1 255.255.255.252
#
interface 25GE1/0/48
 description TO-S1-CORE-B-25GE1/0/11
 undo portswitch
 ip address 10.0.253.5 255.255.255.252
#
interface LoopBack0
 ip address 10.0.254.1 255.255.255.255
#
interface LoopBack1
 description VTEP (the same on AGG-B)
 ip address 10.0.254.101 255.255.255.255
#
interface Nve1
 source 10.0.254.101
 vni 101101 head-end peer-list protocol bgp
 mac-address 0000-5e00-0101
#
bgp 65211
 peer 10.0.253.2 as-number 65111
 peer 10.0.253.6 as-number 65111
 #
 ipv4-family unicast
  network 10.0.254.1 255.255.255.255
  network 10.0.254.101 255.255.255.255
  peer 10.0.253.2 enable
  peer 10.0.253.2 allow-as-loop
  peer 10.0.253.6 enable
  peer 10.0.253.6 allow-as-loop
#
bgp 65111 instance evpn1
 peer 10.0.254.251 as-number 65111
 peer 10.0.254.251 connect-interface LoopBack0
 peer 10.0.254.252 as-number 65111
 peer 10.0.254.252 connect-interface LoopBack0
 #
 ipv4-family vpn-instance STAFF
  import-route direct
  advertise l2vpn evpn
 #
 l2vpn-family evpn
  policy vpn-target
  peer 10.0.254.251 enable
  peer 10.0.254.251 advertise irb
  peer 10.0.254.252 enable
  peer 10.0.254.252 advertise irb
#
return
