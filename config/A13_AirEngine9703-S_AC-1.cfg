#
# SYNergy campus network, configuration A.13
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.13
#
# Device: AirEngine 9703-S
# Name:   AC-1
# Role:   WLAN controller
#
# Software: V600R025C10 (Table 66); the AC and its fit APs run one release,
# and the commands follow the AirEngine X700 V600R026C00 CLI configuration
# guide linked below. Dual-link hot standby: every AP keeps CAPWAP to AC-1 and
# AC-2 (primary and backup access address), user and AP entries are
# synchronised over the HRP channel, so no Layer 2 is stretched between the
# DCs. The four SSIDs of Table 42 with their VLANs (on the 6 GHz radio of the
# hall APs only the WPA3 ones), 802.1X to NCE, eduroam to the FreeRADIUS IdP
# pair with the visitor UCL group, the guest portal and the 5 Mbit/s guest
# limit, country code UA.
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   AirEngine 9703-S support page
#   https://support.huawei.com/enterprise/en/wlan/airengine-9703-s-pid-260221895
#   WLAN AC AirEngine X700 V600R026C00 CLI-based Configuration Guide:
#   Configuration Examples for NAC
#   https://support.huawei.com/enterprise/en/doc/EDOC1100612395/be42601a/configuration-examples-for-nac
#   WLAN AC AirEngine X700 V600R026C00 CLI-based Configuration Guide:
#   Configuration Examples for WLAN Reliability (HRP)
#   https://support.huawei.com/enterprise/en/doc/EDOC1100612395/289ecbe9/configuration-examples-for-wlan-reliability
#

# AC-1 (AirEngine 9703-S, DC-1): dual-link hot standby with AC-2 in DC-2;
# APs forward user data locally (direct forwarding), so only CAPWAP control crosses the WAN
sysname AC-1
#
vlan batch 1012
#
interface Vlanif1012
 description MGMT-AC-1
 ip address 10.200.12.10 255.255.255.0
#
ip route-static 0.0.0.0 0.0.0.0 10.200.12.1
#
capwap source interface Vlanif1012
#
hrp interface Vlanif1012 remote 10.201.12.10
hrp authentication-key <key>
hrp device active
hrp enable
#
radius-server template NCE
 radius-server shared-key cipher <key>
 radius-server authentication 10.200.10.21 1812
 radius-server authentication 10.201.10.21 1812 secondary
 radius-server accounting 10.200.10.21 1813
 radius-server accounting 10.201.10.21 1813 secondary
radius-server authorization 10.200.10.21 shared-key cipher <key>
#
radius-server template EDU
 radius-server shared-key cipher <key>
 radius-server authentication 10.200.10.26 1812
 radius-server authentication 10.201.10.26 1812 secondary
 radius-server accounting 10.200.10.26 1813
 radius-server accounting 10.201.10.26 1813 secondary
radius-server authorization 10.200.10.26 shared-key cipher <key>
radius-server authorization 10.201.10.26 shared-key cipher <key>
#
aaa
 authentication-scheme AUTH-NCE
  authentication-mode radius
 accounting-scheme ACC-NCE
  accounting-mode radius
 domain campus
  authentication-scheme AUTH-NCE
  accounting-scheme ACC-NCE
  radius-server NCE
 domain eduroam
  authentication-scheme AUTH-NCE
  accounting-scheme ACC-NCE
  radius-server EDU
#
dot1x-access-profile name DOT1X
#
web-auth-server NCE-PORTAL
 server-ip 10.200.10.21
 port 50200
 shared-key cipher <key>
 url https://portal.synergy.example/guest
#
portal-access-profile name PORTAL
 web-auth-server NCE-PORTAL direct
#
authentication-profile name AUTH-DOT1X
 dot1x-access-profile DOT1X
 access-domain campus force
authentication-profile name AUTH-PORTAL
 portal-access-profile PORTAL
 access-domain campus force
authentication-profile name AUTH-EDU
 dot1x-access-profile DOT1X
 access-domain eduroam force
#
# visitors of other realms: the IdP returns Filter-Id = EDU-VISITOR (UCL group);
# they reach DHCP, DNS and NTP in both DCs and the Internet, no campus subnet
ucl-group name EDU-VISITOR index 10
acl number 6010
 rule 5 permit ip source ucl-group name EDU-VISITOR destination ip-address 10.200.10.8 0.0.0.7
 rule 10 permit ip source ucl-group name EDU-VISITOR destination ip-address 10.201.10.8 0.0.0.7
 rule 15 deny ip source ucl-group name EDU-VISITOR destination ip-address 10.0.0.0 0.255.255.255
 rule 20 deny ip source ucl-group name EDU-VISITOR destination ip-address 172.16.0.0 0.15.255.255
 rule 25 deny ip source ucl-group name EDU-VISITOR destination ip-address 192.168.0.0 0.0.255.255
traffic-filter inbound acl 6010
#
wlan
 ac protect enable
 ap auth-mode sn-auth
 traffic-profile name GUEST-5M
  rate-limit client up 5000
  rate-limit client down 5000
  user-isolate l2
 traffic-profile name IOT
  user-isolate l2
 security-profile name SEC-ENT
  security wpa3 dot1x aes
 security-profile name SEC-OPEN
  security open
 security-profile name SEC-IOT
  security wpa3 sae pass-phrase <key> aes
 security-profile name SEC-EDU
  security wpa2-wpa3 dot1x aes
 security-profile name SEC-EDU6
  security wpa3 dot1x aes
 ssid-profile name SSID-STAFF
  ssid SYN-Staff
 ssid-profile name SSID-EDU
  ssid eduroam
 ssid-profile name SSID-GUEST
  ssid SYN-Guest
 ssid-profile name SSID-IOT
  ssid SYN-IoT
  ssid-hide enable
 vap-profile name VAP-STAFF
  forward-mode direct-forward
  service-vlan vlan-id 101
  ssid-profile SSID-STAFF
  security-profile SEC-ENT
  authentication-profile AUTH-DOT1X
 vap-profile name VAP-EDU
  forward-mode direct-forward
  service-vlan vlan-id 201
  ssid-profile SSID-EDU
  security-profile SEC-EDU
  authentication-profile AUTH-EDU
 vap-profile name VAP-EDU6
  forward-mode direct-forward
  service-vlan vlan-id 201
  ssid-profile SSID-EDU
  security-profile SEC-EDU6
  authentication-profile AUTH-EDU
 vap-profile name VAP-GUEST
  forward-mode direct-forward
  service-vlan vlan-id 501
  ssid-profile SSID-GUEST
  security-profile SEC-OPEN
  authentication-profile AUTH-PORTAL
  traffic-profile GUEST-5M
 vap-profile name VAP-IOT
  forward-mode direct-forward
  service-vlan vlan-id 801
  ssid-profile SSID-IOT
  security-profile SEC-IOT
  traffic-profile IOT
 regulatory-domain-profile name UA
  country-code UA
  dca-channel 5g bandwidth 40mhz
# 802.11r/k/v, band steering, WIDS/WIPS and the 802.1X escape VLAN come from
# the NCE-Campus WLAN templates of each AP group
 ap-system-profile name SYS-DC1
  primary-access ip-address 10.200.12.10
  backup-access ip-address 10.201.12.10
 ap-group name S1-A1
  regulatory-domain-profile UA
  ap-system-profile SYS-DC1
  vap-profile VAP-STAFF wlan 1 radio all
  vap-profile VAP-EDU wlan 2 radio all
  vap-profile VAP-GUEST wlan 3 radio all
  vap-profile VAP-IOT wlan 4 radio all
# hall APs (AirEngine 5776-57 in the 5 + 6 GHz mode; radio 0 = 5 GHz, radio 1 = 6 GHz,
# to be confirmed with display ap ability at commissioning): 6 GHz admits only
# WPA3 and OWE, so eduroam is WPA3-Enterprise there and the guest SSID stays off it
 ap-group name S1-A1-HALL
  regulatory-domain-profile UA
  ap-system-profile SYS-DC1
  vap-profile VAP-STAFF wlan 1 radio all
  vap-profile VAP-EDU wlan 2 radio 0
  vap-profile VAP-EDU6 wlan 5 radio 1
  vap-profile VAP-GUEST wlan 3 radio 0
  vap-profile VAP-IOT wlan 4 radio 0
# one AP group per building and floor type; the groups of Sites 2 and 3
# and the Site 1 dormitories use the second pair (AC-3 primary, AC-4 backup)
#
return
#
# AC-2: sysname AC-2; Vlanif1012 10.201.12.10;
# hrp interface Vlanif1012 remote 10.200.12.10; hrp device standby
#
# AC-3 (DC-2) and AC-4 (DC-1): the same configuration, Vlanif1012 10.201.12.11 and
# 10.200.12.11, an HRP pair of their own; ap-system-profile SYS-PAIR2 with
# primary-access 10.201.12.11 and backup-access 10.200.12.11
