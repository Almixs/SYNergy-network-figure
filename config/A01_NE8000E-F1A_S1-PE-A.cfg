#
# SYNergy campus network, configuration A.1
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.1
#
# Device: NetEngine 8000E F1A
# Name:   S1-PE-A
# Role:   PE and route reflector on fibre L4
#
# Software: the release of Table 66; the commands follow the V800R022C00 guide
# linked below. IS-IS level 2 with SR-MPLS (SRGB 16000-23999), TI-LFA and BFD
# 10 ms x 3 on fibre L4; MP-BGP VPNv4/VPNv6 with S1-PE-A as route reflector of
# S1-PE-B and DC2-PE-A; the VRFs ride SR-MPLS BE through the tunnel policy;
# each VRF is handed to the DC-1 border leafs on its own subinterface. Shown
# for VRF STAFF; the other VRFs differ only in the RT and VLAN.
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   NetEngine 8000 V800R022C00 Configuration Guide: Segment Routing MPLS
#   https://support.huawei.com/enterprise/en/doc/EDOC1100279009/4b881567/segment-routing-mpls-configuration
#   Example for Configuring L3VPN over IS-IS SR-MPLS BE
#   https://support.huawei.com/enterprise/en/doc/EDOC1100125451/94c70a68/example-for-configuring-l3vpn-over-is-is-sr-mpls-be
#   Example for Configuring TI-LFA FRR for an SR-MPLS BE Tunnel
#   https://support.huawei.com/enterprise/en/doc/EDOC1100125842/2ed67c0f/example-for-configuring-ti-lfa-frr-for-an-sr-mpls-be-tunnel
#   NetEngine 8000 V800R022C00 Configuration Guide: BGP
#   https://support.huawei.com/enterprise/en/doc/EDOC1100279009/be059964/bgp-configuration
#

# S1-PE-A (NetEngine 8000E F1A): PE and route reflector on fibre L4
sysname S1-PE-A
#
tunnel-policy TP-SR
 tunnel select-seq sr-lsp load-balance-number 1
#
ip vpn-instance STAFF
 ipv4-family
  route-distinguisher 10.255.1.1:1
  tnl-policy TP-SR
  vpn-target 65001:1 export-extcommunity
  vpn-target 65001:1 import-extcommunity
 ipv6-family
  route-distinguisher 10.255.1.1:1
  tnl-policy TP-SR
  vpn-target 65001:1 export-extcommunity
  vpn-target 65001:1 import-extcommunity
# the other VRFs the same way, RT 65001:n (n = VNI - 50000):
# MGMT 0, STUDENT 2, GUEST 3, VOICE 4, PRINT 5, CCTV 6, IOT 7, DC 8, DMZ 9
#
bfd
#
mpls lsr-id 10.255.1.1
#
mpls
#
segment-routing
#
isis 1
 is-level level-2
 cost-style wide
 network-entity 49.0001.0102.5500.1001.00
 bfd all-interfaces enable
 bfd all-interfaces min-tx-interval 10 min-rx-interval 10 detect-multiplier 3
 segment-routing mpls
 segment-routing global-block 16000 23999
 frr
  loop-free-alternate level-2
  ti-lfa level-2
#
interface 100GE1/0/1
 undo shutdown
 description TO-DC2-PE-A-100GE1/0/1-L4A
 mtu 9216
 ip address 10.255.2.1 255.255.255.252
 isis enable 1
 isis circuit-type p2p
 # MACsec AES-256 on both L4 ports per the NetEngine 8000 MACsec guide; keys not shown
#
interface 100GE1/0/2
 undo shutdown
 description TO-S1-PE-B-100GE1/0/2
 mtu 9216
 ip address 10.255.2.9 255.255.255.252
 isis enable 1
 isis circuit-type p2p
#
interface 100GE1/0/3.1001
 description TO-DC1-BL-1-VRF-STAFF
 vlan-type dot1q 1001
 ip binding vpn-instance STAFF
 ip address 10.254.11.5 255.255.255.252
#
interface LoopBack0
 description RID
 ip address 10.255.1.1 255.255.255.255
 isis enable 1
 isis prefix-sid index 1
#
bgp 65001
 router-id 10.255.1.1
 peer 10.255.1.2 as-number 65001
 peer 10.255.1.2 connect-interface LoopBack0
 peer 10.255.1.3 as-number 65001
 peer 10.255.1.3 connect-interface LoopBack0
 peer 10.255.1.4 as-number 65001
 peer 10.255.1.4 connect-interface LoopBack0
 #
 ipv4-family unicast
  peer 10.255.1.2 enable
  peer 10.255.1.3 enable
  peer 10.255.1.4 enable
 #
 ipv4-family vpnv4
  policy vpn-target
  peer 10.255.1.2 enable
  peer 10.255.1.2 reflect-client
  peer 10.255.1.3 enable
  peer 10.255.1.3 reflect-client
  peer 10.255.1.4 enable
 #
 ipv6-family vpnv6
  policy vpn-target
  peer 10.255.1.2 enable
  peer 10.255.1.2 reflect-client
  peer 10.255.1.3 enable
  peer 10.255.1.3 reflect-client
  peer 10.255.1.4 enable
 #
 ipv4-family vpn-instance STAFF
  peer 10.254.11.6 as-number 65101
  peer 10.254.11.6 bfd enable
#
return
