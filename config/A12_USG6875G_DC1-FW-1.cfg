#
# SYNergy campus network, configuration A.12
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.12
#
# Device: HiSecEngine USG6875G
# Name:   DC1-FW-1
# Role:   firewall pair of DC-1
#
# Software: the release of Table 66; the commands follow the USG configuration
# examples linked below. HRP active/standby with VRRP on each subinterface,
# one zone per VRF, static routes to the border leaf VIPs, address and service
# objects, NAT44 (STAFF on its own /27, students and guests in port blocks),
# the DMZ servers, the rules P00-P12 of Security Design (with the eduroam
# RADIUS path and CAPWAP from the APs to the controllers) and SSL VPN with
# RADIUS to NCE. Public addresses are documentation blocks (198.51.100.0/24,
# 203.0.113.0/24) and the placeholder 203.0.114.0/24 until the RIPE blocks are
# assigned.
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   USG6000F Typical Configuration Examples: Configuring Hot Standby in
#   Active/Standby Mode
#   https://support.huawei.com/enterprise/en/doc/EDOC1100387632/b829a619/configuring-hot-standby-in-active-standby-mode
#   HiSecEngine USG6800G product page
#   https://e.huawei.com/en/products/security/usg6800g
#

# DC1-FW-1 (HiSecEngine USG6875G), HRP active; DC1-FW-2 = the deltas at the end
sysname DC1-FW-1
#
interface Eth-Trunk0
 description HRP-TO-DC1-FW-2
 ip address 10.255.255.1 255.255.255.252
#
interface 100GE1/0/6
 eth-trunk 0
interface 100GE1/0/7
 eth-trunk 0
#
interface Eth-Trunk1
 description TO-DC1-BL-1-BL-2 M-LAG 20
 mode lacp-static
#
interface 100GE1/0/0
 eth-trunk 1
interface 100GE1/0/1
 eth-trunk 1
#
interface Eth-Trunk1.1000
 description VRF-MGMT
 vlan-type dot1q 1000
 ip address 10.254.1.1 255.255.255.248
 vrrp vrid 1 virtual-ip 10.254.1.5 active
interface Eth-Trunk1.1001
 description VRF-STAFF
 vlan-type dot1q 1001
 ip address 10.254.1.9 255.255.255.248
 vrrp vrid 2 virtual-ip 10.254.1.13 active
interface Eth-Trunk1.1002
 description VRF-STUDENT
 vlan-type dot1q 1002
 ip address 10.254.1.17 255.255.255.248
 vrrp vrid 3 virtual-ip 10.254.1.21 active
interface Eth-Trunk1.1003
 description VRF-GUEST
 vlan-type dot1q 1003
 ip address 10.254.1.25 255.255.255.248
 vrrp vrid 4 virtual-ip 10.254.1.29 active
interface Eth-Trunk1.1004
 description VRF-VOICE
 vlan-type dot1q 1004
 ip address 10.254.1.33 255.255.255.248
 vrrp vrid 5 virtual-ip 10.254.1.37 active
interface Eth-Trunk1.1005
 description VRF-PRINT
 vlan-type dot1q 1005
 ip address 10.254.1.41 255.255.255.248
 vrrp vrid 6 virtual-ip 10.254.1.45 active
interface Eth-Trunk1.1006
 description VRF-CCTV
 vlan-type dot1q 1006
 ip address 10.254.1.49 255.255.255.248
 vrrp vrid 7 virtual-ip 10.254.1.53 active
interface Eth-Trunk1.1007
 description VRF-IOT
 vlan-type dot1q 1007
 ip address 10.254.1.57 255.255.255.248
 vrrp vrid 8 virtual-ip 10.254.1.61 active
interface Eth-Trunk1.1008
 description VRF-DC
 vlan-type dot1q 1008
 ip address 10.254.1.65 255.255.255.248
 vrrp vrid 9 virtual-ip 10.254.1.69 active
interface Eth-Trunk1.1009
 description VRF-DMZ-GATEWAY
 vlan-type dot1q 1009
 ip address 10.210.1.1 255.255.255.0
 vrrp vrid 10 virtual-ip 10.210.1.254 active
interface Eth-Trunk1.1015
 description VRF-INTERNET-TO-DC1-ER-1-ER-2
 vlan-type dot1q 1015
 ip address 198.51.100.4 255.255.255.248
 vrrp vrid 11 virtual-ip 198.51.100.6 active
#
hrp enable
hrp interface Eth-Trunk0 remote 10.255.255.2
hrp mirror session enable
hrp track interface Eth-Trunk1
#
firewall zone trust
 add interface Eth-Trunk0
firewall zone name MGMT
 set priority 95
 add interface Eth-Trunk1.1000
firewall zone name STAFF
 set priority 82
 add interface Eth-Trunk1.1001
firewall zone name STUDENT
 set priority 60
 add interface Eth-Trunk1.1002
firewall zone name GUEST
 set priority 40
 add interface Eth-Trunk1.1003
firewall zone name VOICE
 set priority 75
 add interface Eth-Trunk1.1004
firewall zone name PRINT
 set priority 55
 add interface Eth-Trunk1.1005
firewall zone name CCTV
 set priority 48
 add interface Eth-Trunk1.1006
firewall zone name IOT
 set priority 45
 add interface Eth-Trunk1.1007
firewall zone name DC
 set priority 90
 add interface Eth-Trunk1.1008
firewall zone dmz
 add interface Eth-Trunk1.1009
firewall zone untrust
 add interface Eth-Trunk1.1015
#
ip route-static 10.0.0.0 255.252.0.0 10.254.1.6
ip route-static 10.16.0.0 255.252.0.0 10.254.1.14
ip route-static 10.32.0.0 255.248.0.0 10.254.1.22
ip route-static 10.64.0.0 255.252.0.0 10.254.1.30
ip route-static 10.72.0.0 255.252.0.0 10.254.1.38
ip route-static 10.76.0.0 255.255.192.0 10.254.1.46
ip route-static 10.80.0.0 255.252.0.0 10.254.1.54
ip route-static 10.84.0.0 255.252.0.0 10.254.1.62
ip route-static 10.200.0.0 255.255.0.0 10.254.1.70
ip route-static 10.201.0.0 255.255.0.0 10.254.1.70
# DC-2 servers (IdP, NCE, Kea) are reached in VRF DC through the border leafs,
# not through the Internet edge
ip route-static 0.0.0.0 0.0.0.0 198.51.100.3
#
ip address-set DC-CORE type object
 address 0 range 10.200.10.10 10.200.10.15
ip address-set DC-NCE type object
 address 0 10.200.10.20 mask 32
 address 1 10.200.10.21 mask 32
ip address-set DC-JUMP type object
 address 0 range 10.200.10.22 10.200.10.25
ip address-set DC-AD-PKI type object
 address 0 10.200.10.30 mask 32
 address 1 10.200.10.31 mask 32
ip address-set DC-SIEM type object
 address 0 10.200.10.50 mask 32
ip address-set DC-AC type object
 address 0 10.200.12.10 mask 32
 address 1 10.200.12.11 mask 32
ip address-set DC-LMS type object
 address 0 10.200.20.0 mask 24
ip address-set DC-LECT type object
 address 0 10.200.30.0 mask 24
ip address-set DC-VOICE type object
 address 0 10.200.40.10 mask 32
 address 1 10.200.40.11 mask 32
ip address-set DC-PAPERCUT type object
 address 0 10.200.50.10 mask 32
ip address-set DC-VMS type object
 address 0 10.200.50.20 mask 32
ip address-set DC-ACS-BMS type object
 address 0 10.200.50.30 mask 32
ip address-set DMZ-PROXY type object
 address 0 10.210.1.10 mask 32
 address 1 10.210.1.11 mask 32
ip address-set DMZ-JITSI-WEB type object
 address 0 10.210.1.12 mask 32
ip address-set DMZ-TURN type object
 address 0 10.210.1.14 mask 32
ip address-set DMZ-DNS type object
 address 0 10.210.1.53 mask 32
ip address-set DMZ-EDU-PROXY type object
 address 0 10.210.1.15 mask 32
ip address-set DC-EDU-IDP type object
 address 0 10.200.10.26 mask 32
 address 1 10.201.10.26 mask 32
# URAN national eduroam proxies: addresses given by URAN on joining
ip address-set URAN-FLR type object
 address 0 192.0.2.10 mask 32
 address 1 192.0.2.11 mask 32
ip address-set NET-IT-ADMINS type object
 address 0 10.16.10.0 mask 24
ip service-set SVC-CORE type object
 service 0 protocol udp destination-port 53 67 123
 service 1 protocol tcp destination-port 53
ip service-set SVC-TURN type object
 service 0 protocol udp destination-port 3478 49152 to 65535
 service 1 protocol tcp destination-port 3478 5349
ip service-set SVC-JVB type object
 service 0 protocol udp destination-port 10000
ip service-set SVC-RADIUS type object
 service 0 protocol udp destination-port 1812 1813
 service 1 protocol tcp destination-port 2083
ip service-set SVC-XMPP type object
 service 0 protocol tcp destination-port 5222 5280
ip service-set SVC-AD type object
 service 0 protocol tcp destination-port 88 389 445 464 636 3268
 service 1 protocol udp destination-port 88 464
ip service-set SVC-PRINT-IN type object
 service 0 protocol tcp destination-port 443 631 9191 9192
ip service-set SVC-PRINT-OUT type object
 service 0 protocol tcp destination-port 631 9100
ip service-set SVC-SIP type object
 service 0 protocol tcp destination-port 443 5061
 service 1 protocol udp destination-port 10000 to 20000
ip service-set SVC-VMS type object
 service 0 protocol tcp destination-port 443 554 8000
 service 1 protocol udp destination-port 3702
ip service-set SVC-IOT type object
 service 0 protocol tcp destination-port 443 8883
ip service-set SVC-MGMT-IN type object
 service 0 protocol tcp destination-port 22 443 830
 service 1 protocol udp destination-port 161
ip service-set SVC-MGMT-OUT type object
 service 0 protocol udp destination-port 123 162 514 1812 1813
 service 1 protocol tcp destination-port 49 443 10020 31000
ip service-set SVC-CAPWAP type object
 service 0 protocol udp destination-port 5246 5247
ip service-set SVC-VPN type object
 service 0 protocol tcp destination-port 443
 service 1 protocol udp destination-port 443
ip service-set SVC-NETCONF type object
 service 0 protocol tcp destination-port 830
ip service-set SVC-BFD type object
 service 0 protocol udp destination-port 3784 3785
#
nat address-group NAT-STAFF 1
 mode pat
 route enable
 section 0 198.51.100.32 198.51.100.63
nat address-group NAT-PBA 2
 mode pat
 route enable
 section 0 198.51.100.64 198.51.100.255
 section 1 203.0.114.0 203.0.114.255
#
nat server WEB protocol tcp global 198.51.100.10 443 inside 10.210.1.10 443 no-reverse
nat server LMS protocol tcp global 198.51.100.11 443 inside 10.210.1.11 443 no-reverse
nat server JITSI protocol tcp global 198.51.100.12 443 inside 10.210.1.12 443 no-reverse
nat server TURN global 198.51.100.14 inside 10.210.1.14 no-reverse
nat server DNS global 203.0.113.53 inside 10.210.1.53 no-reverse
# eduroam proxy: two-way mapping, so its requests to URAN leave from the registered address
nat server EDU global 198.51.100.15 inside 10.210.1.15
#
nat-policy
 rule name NAT-STAFF
  source-zone STAFF
  destination-zone untrust
  action source-nat address-group NAT-STAFF
 rule name NAT-STUDENT-GUEST
  source-zone STUDENT GUEST
  destination-zone untrust
  action source-nat address-group NAT-PBA
 rule name NAT-DC-DMZ
  source-zone DC dmz
  destination-zone untrust
  action source-nat easy-ip
#
security-policy
 rule name P01-CORE-SERVICES
  source-zone STAFF STUDENT GUEST VOICE PRINT CCTV IOT
  destination-zone DC
  destination-address address-set DC-CORE
  service SVC-CORE
  profile ips default
  action permit
 rule name P02A-INET-TO-DMZ-WEB
  source-zone untrust
  destination-zone dmz
  destination-address address-set DMZ-PROXY
  destination-address address-set DMZ-JITSI-WEB
  service https
  profile ips default
  action permit
 rule name P02B-INET-TO-DMZ-DNS
  source-zone untrust
  destination-zone dmz
  destination-address address-set DMZ-DNS
  service dns
  profile ips default
  action permit
 rule name P02C-INET-TO-DMZ-TURN
  source-zone untrust
  destination-zone dmz
  destination-address address-set DMZ-TURN
  service SVC-TURN
  profile ips default
  action permit
 rule name P02D-INET-TO-DMZ-EDUROAM
  source-zone untrust
  destination-zone dmz
  source-address address-set URAN-FLR
  destination-address address-set DMZ-EDU-PROXY
  service SVC-RADIUS
  action permit
 rule name P03A-DMZ-PROXY-TO-LMS
  source-zone dmz
  destination-zone DC
  source-address address-set DMZ-PROXY
  destination-address address-set DC-LMS
  service https
  profile ips default
  action permit
 rule name P03B-DMZ-JITSI-TO-XMPP
  source-zone dmz
  destination-zone DC
  source-address address-set DMZ-JITSI-WEB
  destination-address address-set DC-LECT
  service SVC-XMPP
  profile ips default
  action permit
 rule name P03C-DMZ-TURN-TO-JVB
  source-zone dmz
  destination-zone DC
  source-address address-set DMZ-TURN
  destination-address address-set DC-LECT
  service SVC-JVB
  action permit
 rule name P03D-DMZ-UPDATES
  source-zone dmz
  destination-zone untrust
  service dns
  service https
  service ntp
  profile ips default
  action permit
 rule name P03E-DMZ-EDU-PROXY-TO-IDP
  source-zone dmz
  destination-zone DC
  source-address address-set DMZ-EDU-PROXY
  destination-address address-set DC-EDU-IDP
  service SVC-RADIUS
  action permit
 rule name P03F-DMZ-EDU-PROXY-TO-URAN
  source-zone dmz
  destination-zone untrust
  source-address address-set DMZ-EDU-PROXY
  destination-address address-set URAN-FLR
  service SVC-RADIUS
  action permit
 rule name P04A-STAFF-TO-DC
  source-zone STAFF
  destination-zone DC
  destination-address address-set DC-AD-PKI
  destination-address address-set DC-LMS
  destination-address address-set DC-LECT
  destination-address address-set DC-PAPERCUT
  service SVC-AD
  service https
  service SVC-XMPP
  service SVC-JVB
  service SVC-PRINT-IN
  profile av default
  profile ips default
  action permit
 rule name P04B-ADMINS-TO-JUMP
  source-zone STAFF
  destination-zone DC
  source-address address-set NET-IT-ADMINS
  destination-address address-set DC-JUMP
  service https
  profile ips default
  action permit
 rule name P04C-USERS-TO-DMZ
  source-zone STAFF STUDENT GUEST
  destination-zone dmz
  service https
  service dns
  service SVC-TURN
  profile ips default
  action permit
 rule name P05A-STUDENT-TO-DC
  source-zone STUDENT
  destination-zone DC
  destination-address address-set DC-LMS
  destination-address address-set DC-LECT
  destination-address address-set DC-PAPERCUT
  service https
  service SVC-XMPP
  service SVC-JVB
  service SVC-PRINT-IN
  profile av default
  profile ips default
  action permit
 rule name P05B-GUEST-TO-PORTAL
  source-zone GUEST
  destination-zone DC
  destination-address address-set DC-NCE
  service https
  profile ips default
  action permit
 rule name P06-VOICE-TO-PBX
  source-zone VOICE
  destination-zone DC
  destination-address address-set DC-VOICE
  service SVC-SIP
  profile ips default
  action permit
 rule name P07A-PRINT-TO-PAPERCUT
  source-zone PRINT
  destination-zone DC
  destination-address address-set DC-PAPERCUT
  service SVC-PRINT-IN
  action permit
 rule name P07B-CCTV-TO-VMS
  source-zone CCTV
  destination-zone DC
  destination-address address-set DC-VMS
  service SVC-VMS
  action permit
 rule name P07C-IOT-TO-ACS-BMS
  source-zone IOT
  destination-zone DC
  destination-address address-set DC-ACS-BMS
  service SVC-IOT
  action permit
 rule name P08A-PBX-TO-VOICE
  source-zone DC
  destination-zone VOICE
  source-address address-set DC-VOICE
  service SVC-SIP
  action permit
 rule name P08B-PAPERCUT-TO-PRINT
  source-zone DC
  destination-zone PRINT
  source-address address-set DC-PAPERCUT
  service SVC-PRINT-OUT
  action permit
 rule name P08C-VMS-TO-CCTV
  source-zone DC
  destination-zone CCTV
  source-address address-set DC-VMS
  service SVC-VMS
  action permit
 rule name P08D-BMS-TO-IOT
  source-zone DC
  destination-zone IOT
  source-address address-set DC-ACS-BMS
  service SVC-IOT
  action permit
 rule name P09A-NCE-JUMP-TO-MGMT
  source-zone DC
  destination-zone MGMT
  source-address address-set DC-NCE
  source-address address-set DC-JUMP
  service SVC-MGMT-IN
  profile ips default
  action permit
 rule name P09B-MGMT-TO-NCE-SIEM
  source-zone MGMT
  destination-zone DC
  destination-address address-set DC-NCE
  destination-address address-set DC-SIEM
  destination-address address-set DC-CORE
  service SVC-MGMT-OUT
  service dns
  action permit
 rule name P09C-AP-TO-AC
  source-zone MGMT
  destination-zone DC
  destination-address address-set DC-AC
  service SVC-CAPWAP
  action permit
 rule name P10A-USERS-TO-INTERNET
  source-zone STAFF STUDENT GUEST
  destination-zone untrust
  profile av default
  profile ips default
  profile url-filter default
  action permit
 rule name P10B-DC-TO-INTERNET
  source-zone DC
  destination-zone untrust
  service https
  service dns
  service ntp
  service SVC-SIP
  profile ips default
  action permit
 rule name P11-SSL-VPN
  source-zone untrust
  destination-zone local
  service SVC-VPN
  profile ips default
  action permit
 rule name P12-IDP-TO-EDU-PROXY
  source-zone DC
  destination-zone dmz
  source-address address-set DC-EDU-IDP
  destination-address address-set DMZ-EDU-PROXY
  service SVC-RADIUS
  action permit
# management of the firewall only from NCE (with SecoManager) and the jump hosts;
# nothing from untrust except the SSL VPN portal (P11)
 rule name P00-LOCAL-MGMT
  source-zone DC
  destination-zone local
  source-address address-set DC-NCE
  source-address address-set DC-JUMP
  service ssh
  service snmp
  service SVC-NETCONF
  action permit
 rule name P00-LOCAL-CONTROL
  source-zone local trust DC MGMT
  destination-zone local
  service icmp
  service SVC-BFD
  action permit
#
radius-server template NCE
 radius-server shared-key cipher <key>
 radius-server authentication 10.200.10.21 1812
 radius-server authentication 10.201.10.21 1812 secondary
#
aaa
 authentication-scheme AUTH-NCE
  authentication-mode radius
 domain staff
  authentication-scheme AUTH-NCE
  radius-server NCE
  service-type ssl-vpn
#
v-gateway SYN-VPN interface Eth-Trunk1.1015 private
v-gateway SYN-VPN authentication-domain staff
v-gateway SYN-VPN
 service
  network-extension enable
  network-extension keep-alive enable
  network-extension netpool 10.16.240.1 10.16.255.254 255.255.240.0
#
info-center loghost 10.200.10.50
#
return
#
# DC1-FW-2: sysname DC1-FW-2; Eth-Trunk0 10.255.255.2 with hrp interface ... remote 10.255.255.1;
# Eth-Trunk1 description TO-DC1-BL-1-BL-2 M-LAG 21 (its own M-LAG on the border leafs);
# every subinterface address +1 (10.254.1.2, .10 ... 10.210.1.2, 198.51.100.5) and vrrp ... standby
# instead of active. Rules, NAT and objects are synchronised by HRP.
