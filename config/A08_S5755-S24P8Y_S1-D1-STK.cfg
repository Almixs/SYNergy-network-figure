#
# SYNergy campus network, configuration A.8
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.8
#
# Device: CloudEngine S5755-S24P8Y
# Name:   S1-D1-STK
# Role:   dormitory iStack
#
# Software: the release of Table 66; the commands follow the CloudEngine S
# guides linked below. Six switches (four floors, the basement and the
# shelter) in one iStack ring over 25GE stack links; one Eth-Trunk with
# members on two switches to the Site 1 cores, which are the dormitory
# gateway; NAC as on the academic access switch. Floor 2 is stack member 2
# (port schedule in Table 28).
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   CloudEngine S5700 V600 hardware and stacking
#   https://support.huawei.com/enterprise/en/doc/EDOC1100277349
#   CloudEngine S V600R022C10 Configuration Guide: Configuring an
#   Authentication Access Device
#   https://support.huawei.com/enterprise/en/doc/EDOC1100304990/ce2a2ed4/configuring-an-authentication-access-device
#

# S1-D1-STK (6 x CloudEngine S5755-S24P8Y in one iStack ring): dormitory S1-D1;
# members 1-4 = floors 1-4, 5 = basement, 6 = shelter; member IDs, priorities
# and stack ports are set before the stack cables are linked
stack
 stack member 1 priority 200
 stack member 1 domain 10
 stack member 2 priority 150
 stack member 2 domain 10
 # members 3-6: priority 100, domain 10
#
interface Stack-Port1/1
 port member-group interface 25GE 1/0/1
interface Stack-Port1/2
 port member-group interface 25GE 1/0/2
interface Stack-Port2/1
 port member-group interface 25GE 2/0/1
interface Stack-Port2/2
 port member-group interface 25GE 2/0/2
# Stack-Port3/1 to Stack-Port6/2 the same way: ring 1-2-3-4-5-6-1
#
sysname S1-D1-STK
#
vlan batch 21 210 to 214 510 to 514 610 to 614
#
radius-server template NCE
 radius-server shared-key cipher <key>
 radius-server authentication 10.200.10.21 1812
 radius-server authentication 10.201.10.21 1812 secondary
 radius-server accounting 10.200.10.21 1813
 radius-server accounting 10.201.10.21 1813 secondary
 radius-server authorization 10.200.10.21 shared-key cipher <key>
 radius-server authorization 10.201.10.21 shared-key cipher <key>
#
aaa
 authentication-scheme AUTH-NCE
  authentication-mode radius
 accounting-scheme ACC-NCE
  accounting-mode radius
 domain campus
  authentication-scheme AUTH-NCE
  accounting-scheme ACC-NCE
  radius-server NCE
#
dot1x-access-profile name DOT1X
mac-access-profile name MAB
authentication-profile name NAC
 dot1x-access-profile DOT1X
 mac-access-profile MAB
 access-domain campus force
# RADIUS of NCE unreachable (DC-1 lost before the DR copy runs): new users get VLAN 512
# (Internet, LMS and lectures through the DMZ)
 authentication event authen-server-down action authorize vlan 512
 authentication event authen-server-up action re-authen
#
interface Eth-Trunk1
 description TO-S1-CORE-A-CORE-B
 mode lacp-static
 port link-type trunk
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 21 210 to 214 510 to 514 610 to 614
#
interface 25GE1/0/8
 description TO-S1-CORE-A
 eth-trunk 1
#
interface 25GE4/0/8
 description TO-S1-CORE-B
 eth-trunk 1
#
interface GE2/0/1
 description S1-D1-F2-AP-117
 port link-type trunk
 port trunk pvid vlan 21
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 21 212 512
 stp edged-port enable
# GE2/0/2-12: the other APs of floor 2 (Table 28) the same way
#
interface GE2/0/13
 description S1-D1-F2-201SL-PRINTER
 port link-type access
 port default vlan 612
 stp edged-port enable
 authentication-profile NAC
# GE2/0/14-24: spare, shut down
#
return
