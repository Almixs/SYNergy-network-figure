#
# SYNergy campus network, configuration A.10
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.10
#
# Device: CloudEngine S5735-L8P4X-QA-V2
# Name:   S1-A1-F1-R12-RU1
# Role:   room unit
#
# Software: the release of Table 66; the commands follow the CloudEngine S
# V600R022C10 and V600R023C10 guides linked below. Smart Link over the two
# fibres (master to ELV room 1, slave to ELV room 2), 802.1X with MAC bypass
# on the user ports; the management address by DHCP for zero-touch
# provisioning.
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   CloudEngine S V600R023C10 Configuration Guide: Smart Link
#   https://support.huawei.com/enterprise/en/doc/EDOC1100366575/a2dc12b7/checking-a-smart-link-group-s-links
#   CloudEngine S V600R022C10 Configuration Guide: Configuring an
#   Authentication Access Device
#   https://support.huawei.com/enterprise/en/doc/EDOC1100304990/ce2a2ed4/configuring-an-authentication-access-device
#

# S1-A1-F1-R12-RU1 (CloudEngine S5735-L8P4X-QA-V2): room unit, room 12, floor 1;
# fibre 1 to S1-A1-FT1-2 (master), fibre 2 to S1-A1-FT2-2 (slave)
sysname S1-A1-F1-R12-RU1
#
vlan batch 11 12 101 201 501 551 601 801 4001
#
radius-server template NCE
 radius-server shared-key cipher <key>
 radius-server authentication 10.200.10.21 1812
 radius-server authentication 10.201.10.21 1812 secondary
 radius-server accounting 10.200.10.21 1813
 radius-server accounting 10.201.10.21 1813 secondary
radius-server authorization 10.200.10.21 shared-key cipher <key>
radius-server authorization 10.201.10.21 shared-key cipher <key>
#
aaa
 authentication-scheme AUTH-NCE
  authentication-mode radius
 accounting-scheme ACC-NCE
  accounting-mode radius
 domain campus
  authentication-scheme AUTH-NCE
  accounting-scheme ACC-NCE
  radius-server NCE
#
dot1x-access-profile name DOT1X
#
mac-access-profile name MAB
#
authentication-profile name NAC
 dot1x-access-profile DOT1X
 mac-access-profile MAB
 access-domain campus force
# RADIUS of NCE unreachable (DC-1 lost before the DR copy runs): new users get VLAN 501
# (Internet, LMS and lectures through the DMZ)
 authentication event authen-server-down action authorize vlan 501
 authentication event authen-server-up action re-authen
#
smart-link group 1
 port 10GE1/0/1 master
 port 10GE1/0/2 slave
 restore enable
 flush send control-vlan 4001 password cipher <key>
 protected-vlan reference-instance 0
 smart-link enable
#
interface 10GE1/0/1
 description TO-S1-A1-FT1-2-10GE1/0/2 ODF-12
 port link-type trunk
 port trunk pvid vlan 11
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 11 12 101 201 501 551 601 801 4001
 stp disable
#
interface 10GE1/0/2
 description TO-S1-A1-FT2-2-10GE1/0/2 ODF-12
 port link-type trunk
 port trunk pvid vlan 11
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 11 12 101 201 501 551 601 801 4001
 stp disable
#
interface GE1/0/1
 description R12-PC-1
 port link-type access
 port default vlan 101
 stp edged-port enable
 authentication-profile NAC
# GE1/0/2-5: the other PCs; GE1/0/6-8: the three IP phones (MAB, VLAN 551 from NCE)
# a room unit with an AP (here RU2 of room 12, the lift lobby): GE1/0/8 is a PoE+ trunk
# with PVID 12 and VLANs 12, 101, 201, 501 and 801
#
interface Vlanif11
 description MGMT
 ip address dhcp-alloc
#
return
