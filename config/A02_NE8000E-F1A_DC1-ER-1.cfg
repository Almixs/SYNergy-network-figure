#
# SYNergy campus network, configuration A.2
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.2
#
# Device: NetEngine 8000E F1A
# Name:   DC1-ER-1
# Role:   Internet edge
#
# Software: the release of Table 66; the commands follow the V800R022C00 guide
# linked below. eBGP to ISP A (DC1-ER-2 to ISP B the same way) with GTSM, BFD
# and a prefix limit; RPKI origin validation drops invalid routes; FlowSpec
# rules from the ISPs; only our own blocks go out. ISP link addresses are
# given by the ISPs.
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   NetEngine 8000 V800R022C00 Configuration Guide: BGP (RPKI, Flow
#   Specification)
#   https://support.huawei.com/enterprise/en/doc/EDOC1100279009/be059964/bgp-configuration
#   NetEngine 8000 V800R022C00 Configuration Guide: Routing Policy
#   https://support.huawei.com/enterprise/en/doc/EDOC1100279009/f8293a6d/routing-policy-configuration
#

# DC1-ER-1 (NetEngine 8000E F1A): Internet edge, own AS 64500 (documentation AS);
# its global table is VRF INTERNET of the design
# DC1-ER-2: the same configuration with its 100GE circuit to ISP B (AS 64497)
sysname DC1-ER-1
#
bfd
#
ip ip-prefix PL-OWN index 10 permit 198.51.100.0 24
ip ip-prefix PL-OWN index 20 permit 203.0.113.0 24
ip ip-prefix PL-OWN index 30 permit 203.0.114.0 24
ip ip-prefix PL-BOGON index 10 permit 10.0.0.0 8 less-equal 32
ip ip-prefix PL-BOGON index 20 permit 172.16.0.0 12 less-equal 32
ip ip-prefix PL-BOGON index 30 permit 192.168.0.0 16 less-equal 32
ip ip-prefix PL-BOGON index 40 permit 198.51.100.0 24 less-equal 32
#
route-policy RP-ISP-IN deny node 10
 if-match ip-prefix PL-BOGON
route-policy RP-ISP-IN deny node 20
 if-match rpki origin-as-validation invalid
route-policy RP-ISP-IN permit node 30
#
route-policy RP-ISP-OUT permit node 10
 if-match ip-prefix PL-OWN
#
rpki
 session 10.200.10.17
  tcp port 3323
#
interface 100GE1/0/1
 undo shutdown
 description ISP-A-<circuit id>
 ip address <ISP A link address> 255.255.255.252
#
interface 100GE1/0/3.1015
 description TO-DC1-FW-VRF-INTERNET
 vlan-type dot1q 1015
 ip address 198.51.100.1 255.255.255.248
 vrrp vrid 1 virtual-ip 198.51.100.3
 vrrp vrid 1 priority 120
#
interface LoopBack0
 ip address 198.51.100.16 255.255.255.255
#
ospf 1 router-id 198.51.100.16
 area 0.0.0.0
  network 198.51.100.0 0.0.0.7
  network 198.51.100.16 0.0.0.0
  network 10.255.20.0 0.0.0.255
#
# own blocks: announced from NULL0; the FW (VIP .6) owns the VIPs and NAT pools
ip route-static 198.51.100.0 255.255.255.0 NULL0
ip route-static 203.0.113.0 255.255.255.0 NULL0
ip route-static 203.0.114.0 255.255.255.0 NULL0
ip route-static 198.51.100.8 255.255.255.248 198.51.100.6
ip route-static 198.51.100.32 255.255.255.224 198.51.100.6
ip route-static 198.51.100.64 255.255.255.192 198.51.100.6
ip route-static 198.51.100.128 255.255.255.128 198.51.100.6
ip route-static 203.0.113.0 255.255.255.0 198.51.100.6
ip route-static 203.0.114.0 255.255.255.0 198.51.100.6
#
bgp 64500
 router-id 198.51.100.16
 peer <ISP A address> as-number 64496
 peer <ISP A address> description ISP-A
 peer <ISP A address> valid-ttl-hops 1
 peer <ISP A address> bfd enable
 peer 198.51.100.17 as-number 64500
 peer 198.51.100.17 description DC1-ER-2
 peer 198.51.100.17 connect-interface LoopBack0
# DC2-ER-1 and DC2-ER-2: iBGP the same way (full mesh of the four ERs)
 #
 ipv4-family unicast
  network 198.51.100.0 255.255.255.0
  network 203.0.113.0 255.255.255.0
  network 203.0.114.0 255.255.255.0
  prefix origin-validation enable
  peer <ISP A address> enable
  peer <ISP A address> route-policy RP-ISP-IN import
  peer <ISP A address> route-policy RP-ISP-OUT export
  peer <ISP A address> route-limit 1200000 90 alert-only
  peer 198.51.100.17 enable
  peer 198.51.100.17 next-hop-local
 #
 ipv4-family flow
  peer <ISP A address> enable
#
return
