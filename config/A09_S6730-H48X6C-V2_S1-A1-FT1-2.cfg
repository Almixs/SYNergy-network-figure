#
# SYNergy campus network, configuration A.9
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.9
#
# Device: CloudEngine S6730-H48X6C-V2
# Name:   S1-A1-FT1-2
# Role:   FTTO switch, ELV room 1
#
# Software: the release of Table 66; the commands follow the CloudEngine S
# V600R023C10 guide linked below. Every room-unit port receives the Smart Link
# flush in control VLAN 4001, so MAC tables are cleared at once when a room
# unit moves to its second fibre; one Eth-Trunk to the M-LAG aggregation pair.
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   CloudEngine S V600R023C10 Configuration Guide: Smart Link
#   https://support.huawei.com/enterprise/en/doc/EDOC1100366575/a2dc12b7/checking-a-smart-link-group-s-links
#

# S1-A1-FT1-2 (CloudEngine S6730-H48X6C-V2): FTTO switch in ELV room 1 of S1-A1
sysname S1-A1-FT1-2
#
vlan batch 11 12 101 201 501 551 601 801 4001
#
interface Eth-Trunk12
 description TO-S1-A1-AGG-A-AGG-B M-LAG 12
 mode lacp-static
 port link-type trunk
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 11 12 101 201 501 551 601 801
#
interface 10GE1/0/2
 description TO-S1-A1-F1-R12-RU1-10GE1/0/1 ODF-12
 port link-type trunk
 port trunk pvid vlan 11
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 11 12 101 201 501 551 601 801 4001
 stp disable
 smart-link flush receive control-vlan 4001 password cipher <key>
# 10GE1/0/1-40: the room units of floors 1-4 the same way
#
interface 10GE1/0/47
 description TO-S1-A1-AGG-A-25GE1/0/12
 eth-trunk 12
#
interface 10GE1/0/48
 description TO-S1-A1-AGG-B-25GE1/0/12
 eth-trunk 12
#
interface Vlanif11
 description MGMT
 ip address 10.0.40.12 255.255.255.0
#
ip route-static 0.0.0.0 0.0.0.0 10.0.40.1
#
return
