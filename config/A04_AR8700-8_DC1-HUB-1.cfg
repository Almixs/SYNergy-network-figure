#
# SYNergy campus network, configuration A.4
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.4
#
# Device: NetEngine AR8700-8
# Name:   DC1-HUB-1
# Role:   IPsec hub and VPN route reflector
#
# Software: the release of Table 66; the commands follow the V600R023 guide
# linked below. The same IPsec profile as the edges, one GRE tunnel per edge
# router and ISP line from its public LoopBack1; reflects VPNv4/VPNv6 routes
# to the edge routers and hands each VRF to the DC-1 border leafs.
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   AR5700, AR6700, AR8000 V600R023 Configuration Guide, VPN: Configuring an
#   IPsec Policy
#   https://support.huawei.com/enterprise/en/doc/EDOC1100336497/be7958e2/configuring-an-ipsec-policy
#   Example for Establishing an IPsec Tunnel in ISAKMP Mode Using Certificate
#   Authentication (V600R022)
#   https://support.huawei.com/enterprise/en/doc/EDOC1100262540/29ab816a/example-for-establishing-an-ipsec-tunnel-in-isakmp-mode-using-certificate-authentication
#

# DC1-HUB-1 (NetEngine AR8700-8): IPsec hub and VPN route reflector of DC-1
sysname DC1-HUB-1
#
ip vpn-instance STAFF
 ipv4-family
  route-distinguisher 10.255.1.11:1
  vpn-target 65001:1 export-extcommunity
  vpn-target 65001:1 import-extcommunity
# the other VRFs as on S1-PE-A
#
bfd
#
mpls lsr-id 10.255.1.11
#
mpls
#
mpls ldp
#
pki entity DC1-HUB-1
 common-name DC1-HUB-1
#
pki realm EJBCA
 ca id SYNergy-Issuing-CA
 entity DC1-HUB-1
 enrollment-url http://10.200.10.31/ejbca/publicweb/apply/scep/pkiclient.exe ra
#
ipsec proposal P-WAN
 esp authentication-algorithm sha2-256
 esp encryption-algorithm aes-256
#
ike proposal 10
 encryption-algorithm aes-256
 dh group20
 authentication-algorithm sha2-256
 authentication-method rsa-signature
 integrity-algorithm hmac-sha2-256
 prf hmac-sha2-256
#
ike peer SPOKES
 undo version 1
 ike-proposal 10
 pki realm EJBCA
#
ipsec profile IPSEC-WAN
 ike-peer SPOKES
 proposal P-WAN
 pfs dh-group20
#
interface XGigabitEthernet0/0/1
 description TO-DC1-ER-1
 ip address 10.255.20.1 255.255.255.252
 ospf enable 1 area 0.0.0.0
#
interface XGigabitEthernet0/0/2
 description TO-DC1-ER-2
 ip address 10.255.20.5 255.255.255.252
 ospf enable 1 area 0.0.0.0
#
interface XGigabitEthernet0/0/3.1001
 description TO-DC1-BL-1-VRF-STAFF
 vlan-type dot1q 1001
 ip binding vpn-instance STAFF
 ip address 10.254.12.5 255.255.255.252
#
interface LoopBack0
 description RID
 ip address 10.255.1.11 255.255.255.255
#
interface LoopBack1
 description IPSEC-PUBLIC
 ip address 198.51.100.20 255.255.255.255
 ospf enable 1 area 0.0.0.0
#
interface Tunnel0/0/1
 description TUN-S2-WE-1-ISP-A
 mtu 1400
 tcp adjust-mss 1360
 ip address 10.255.10.10 255.255.255.252
 tunnel-protocol gre
 source LoopBack1
 destination <S2-WE-1 ISP A line address>
 ospf cost 100
 ospf bfd enable
 ospf bfd min-tx-interval 300 min-rx-interval 300 detect-multiplier 3
 mpls
 mpls ldp
 ipsec profile IPSEC-WAN
# one tunnel per edge router and ISP line (S2-WE-1...4, S3-WE-1, 2)
# and one to each DC-2 hub
#
ospf 2 router-id 10.255.1.11
 area 0.0.0.0
  network 10.255.1.11 0.0.0.0
  network 10.255.10.0 0.0.0.255
#
bgp 65001
 router-id 10.255.1.11
 group SPOKES internal
 peer SPOKES connect-interface LoopBack0
 peer 10.255.1.31 group SPOKES
 peer 10.255.1.41 group SPOKES
# S2-WE-2...4 (10.255.1.32-34), S3-WE-2 (10.255.1.42) in the same group
# the AR5710 5G routers (10.255.1.51-56) join the same group on the hubs of their home DC
 peer 10.255.1.21 as-number 65001
 peer 10.255.1.21 connect-interface LoopBack0
 #
 ipv4-family vpnv4
  policy vpn-target
  peer SPOKES enable
  peer SPOKES reflect-client
  peer 10.255.1.21 enable
 #
 ipv6-family vpnv6
  policy vpn-target
  peer SPOKES enable
  peer SPOKES reflect-client
  peer 10.255.1.21 enable
 #
 ipv4-family vpn-instance STAFF
  peer 10.254.12.6 as-number 65101
  peer 10.254.12.6 bfd enable
#
return
