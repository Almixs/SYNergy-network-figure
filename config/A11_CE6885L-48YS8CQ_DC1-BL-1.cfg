#
# SYNergy campus network, configuration A.11
# Source: SYNergy_campus_HLD_LLD v1.3 (24-10-2026), Appendix A.11
#
# Device: CloudEngine CE6885L-48YS8CQ
# Name:   DC1-BL-1
# Role:   DC border leaf
#
# Software: the release of Table 66; the commands follow the CloudEngine
# guides linked below. M-LAG pair towards the firewall pair with one Eth-Trunk
# to each firewall (M-LAG 20 to FW-1, M-LAG 21 to FW-2), one VLANIF with VRRP
# per VRF (BL <-> FW transit plan), the default route of each VRF to the
# firewall VIP advertised into EVPN; the DMZ is a Layer 2 bridge domain to the
# firewall; route reflector for the server leafs.
#
# Not tested in a simulator. Written only from the official Huawei
# documentation listed below; names, VRFs, VLANs, addresses and AS numbers
# are those of the design document. Keys are shown as <key>, addresses
# given by the ISPs as <...>.
#
# Official documentation:
#   CloudEngine 12800 V200R020C10: Example for Configuring VXLAN in
#   Distributed Gateway Mode Using BGP EVPN (with M-LAG)
#   https://support.huawei.com/enterprise/en/doc/EDOC1100198428/5d3aafb1/example-for-configuring-vxlan-in-distributed-gateway-mode-using-bgp-evpn
#   CloudEngine V300 Typical Configuration Examples: M-LAG and VRRP across
#   Data Centers
#   https://support.huawei.com/enterprise/en/doc/EDOC1100312650/2b6dcc34/example-for-configuring-m-lag-and-vrrp-across-data-centers
#

# DC1-BL-1 (CloudEngine CE6885L-48YS8CQ): border leaf of DC-1, M-LAG with DC1-BL-2,
# EVPN route reflector of the DC-1 fabric; hands every VRF to the firewall pair
sysname DC1-BL-1
#
dfs-group 1
 dual-active detection source ip 10.200.254.1 peer 10.200.254.2
 priority 150
#
stp mode rstp
stp v-stp enable
#
evpn-overlay enable
#
vlan batch 1000 to 1009 1015
#
ip vpn-instance STAFF
 ipv4-family
  route-distinguisher 10.200.255.1:1
  vpn-target 65001:1 export-extcommunity evpn
  vpn-target 65001:1 import-extcommunity evpn
 vxlan vni 50001
# the other VRFs (Table 7) the same way
#
bridge-domain 1009
 vxlan vni 31009
 l2 binding vlan 1009
 evpn
  route-distinguisher 10.200.255.1:1009
  vpn-target 65001:1009 export-extcommunity
  vpn-target 65001:1009 import-extcommunity
#
interface Eth-Trunk0
 description PEER-LINK-TO-DC1-BL-2
 mode lacp-static
 peer-link 1
#
# two firewalls are two LACP partners: one Eth-Trunk (M-LAG) to each
interface Eth-Trunk20
 description TO-DC1-FW-1 M-LAG 20
 port link-type trunk
 port trunk allow-pass vlan 1000 to 1009 1015
 mode lacp-static
 dfs-group 1 m-lag 20
#
interface Eth-Trunk21
 description TO-DC1-FW-2 M-LAG 21
 port link-type trunk
 port trunk allow-pass vlan 1000 to 1009 1015
 mode lacp-static
 dfs-group 1 m-lag 21
#
interface Vlanif1001
 description VRF-STAFF-TO-FW
 ip binding vpn-instance STAFF
 ip address 10.254.1.11 255.255.255.248
 vrrp vrid 1 virtual-ip 10.254.1.14
# Vlanif1000, 1002-1008 the same way per the BL <-> FW transit plan;
# VLAN 1009 (DMZ) is Layer 2 only, bound to bridge domain 1009 above
#
interface 100GE1/0/1
 description TO-DC1-SL-1-100GE1/0/1
 undo portswitch
 ip address 10.200.253.1 255.255.255.252
#
interface 100GE1/0/2
 description TO-DC1-SL-2-100GE1/0/1
 undo portswitch
 ip address 10.200.253.5 255.255.255.252
#
interface 100GE1/0/3
 description TO-DC1-FW-1-100GE1/0/0
 eth-trunk 20
#
interface 100GE1/0/4
 description TO-DC1-FW-2-100GE1/0/0
 eth-trunk 21
#
interface 25GE1/0/45
 eth-trunk 0
# 25GE1/0/46-48 the same: peer-link 4 x 25GE
# 100GE1/0/5-6: S1-PE-A, S1-PE-B (routed, one subinterface per VRF);
# 100GE1/0/7-8: DC1-ER-1, DC1-ER-2, trunks of VLAN 1015 only (FW outside <-> ERs, Layer 2)
#
interface LoopBack0
 ip address 10.200.255.1 255.255.255.255
#
interface LoopBack1
 description VTEP (the same on BL-2)
 ip address 10.200.255.10 255.255.255.255
#
interface Nve1
 source 10.200.255.10
 vni 31009 head-end peer-list protocol bgp
 mac-address 0000-5e00-0101
#
ip route-static vpn-instance STAFF 0.0.0.0 0.0.0.0 10.254.1.13
#
bgp 65101
 peer 10.200.253.2 as-number 65201
 peer 10.200.253.6 as-number 65201
 #
 ipv4-family unicast
  network 10.200.255.1 255.255.255.255
  network 10.200.255.10 255.255.255.255
  peer 10.200.253.2 enable
  peer 10.200.253.6 enable
#
bgp 65101 instance evpn1
 peer 10.200.255.3 as-number 65101
 peer 10.200.255.3 connect-interface LoopBack0
 peer 10.200.255.4 as-number 65101
 peer 10.200.255.4 connect-interface LoopBack0
 #
 ipv4-family vpn-instance STAFF
  import-route static
  advertise l2vpn evpn
 #
 l2vpn-family evpn
  undo policy vpn-target
  peer 10.200.255.3 enable
  peer 10.200.255.3 advertise irb
  peer 10.200.255.3 reflect-client
  peer 10.200.255.4 enable
  peer 10.200.255.4 advertise irb
  peer 10.200.255.4 reflect-client
#
return
